plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bombacha.navegador'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bombacha.navegador'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.1.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/LICENSE.md',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/NOTICE.md',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    // Versão ESTÁVEL e fixa. Evita que uma Nightly diferente quebre o build de um dia para o outro.
    implementation 'org.mozilla.geckoview:geckoview:153.0.20260810162159'
}
