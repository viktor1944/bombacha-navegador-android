plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bombacha.navegador'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bombacha.navegador'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    // Current GeckoView Nightly matching the Mozilla JavaDoc snapshot used for this project.
    implementation 'org.mozilla.geckoview:geckoview-nightly:156.0.20260814041239'
}
