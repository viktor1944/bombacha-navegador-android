name: Build Bombacha Firefox Android

env:
  MOZBUILD_STATE_PATH: ${{ github.workspace }}/.bombacha-mozbuild
  GRADLE_USER_HOME: ${{ github.workspace }}/.bombacha-gradle
  XDG_CACHE_HOME: ${{ github.workspace }}/.bombacha-cache
  ANDROID_USER_HOME: ${{ github.workspace }}/.bombacha-android-home
  TMPDIR: ${{ github.workspace }}/.bombacha-tmp

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'bombacha/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Liberar espaço para o Firefox
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 1024
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-android: 'false'

      - name: Baixar kit Bombacha
        uses: actions/checkout@v4
        with:
          path: bombacha-kit

      - name: Baixar Firefox Android estável
        uses: actions/checkout@v4
        with:
          repository: mozilla-firefox/firefox
          ref: release
          fetch-depth: 1
          path: firefox

      - name: Preparar armazenamento e caches
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$MOZBUILD_STATE_PATH" "$GRADLE_USER_HOME" "$XDG_CACHE_HOME" "$ANDROID_USER_HOME" "$TMPDIR" bombacha-kit/logs
          rm -rf "$HOME/.mozbuild" "$HOME/.gradle"
          ln -s "$MOZBUILD_STATE_PATH" "$HOME/.mozbuild"
          ln -s "$GRADLE_USER_HOME" "$HOME/.gradle"
          df -h | tee bombacha-kit/logs/disk-before.txt

      - name: Registrar fonte Firefox
        shell: bash
        run: |
          set -euxo pipefail
          git -C firefox rev-parse HEAD | tee bombacha-kit/logs/firefox-commit.txt
          git -C firefox log -1 --pretty=fuller | tee bombacha-kit/logs/firefox-source.txt

      - name: Bootstrap oficial Firefox Android
        working-directory: firefox
        shell: bash
        run: |
          set -euxo pipefail
          timeout --foreground --signal=TERM 80m stdbuf -oL -eL ./mach --no-interactive bootstrap \
            --application-choice="GeckoView/Firefox for Android" \
            2>&1 | tee ../bombacha-kit/logs/bootstrap.log
          echo "BOOTSTRAP_OK $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee ../bombacha-kit/logs/bootstrap-ok.txt
          df -h | tee ../bombacha-kit/logs/disk-after-bootstrap.txt

      - name: Configurar Java e Android SDK do bootstrap
        shell: bash
        run: |
          set -euxo pipefail
          JAVA_DIR=$(find "$MOZBUILD_STATE_PATH/jdk" -mindepth 1 -maxdepth 1 -type d -name 'jdk*' | sort | head -1)
          test -n "$JAVA_DIR"
          test -d "$MOZBUILD_STATE_PATH/android-sdk-linux"
          echo "JAVA_HOME=$JAVA_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$MOZBUILD_STATE_PATH/android-sdk-linux" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$MOZBUILD_STATE_PATH/android-sdk-linux" >> "$GITHUB_ENV"
          {
            echo "JAVA_HOME=$JAVA_DIR"
            echo "ANDROID_HOME=$MOZBUILD_STATE_PATH/android-sdk-linux"
          } | tee bombacha-kit/logs/android-env.txt

      - name: Configurar Artifact Mode ARM64
        working-directory: firefox
        shell: bash
        run: |
          set -euxo pipefail
          cat > .mozconfig <<'EOF'
          ac_add_options --enable-project=mobile/android
          ac_add_options --enable-artifact-builds
          ac_add_options --target=aarch64
          mk_add_options MOZ_OBJDIR=./objdir-bombacha
          mk_add_options AUTOCLOBBER=1
          EOF
          cat .mozconfig | tee ../bombacha-kit/logs/mozconfig.txt

      # O Gradle do Fenix lê config.status.json. Em um checkout novo esse arquivo
      # só existe depois de ./mach configure. Isto cria o contexto Android sem
      # executar a compilação completa do Gecko.
      - name: Criar contexto Android do Mach
        working-directory: firefox
        shell: bash
        run: |
          set -euxo pipefail
          timeout --foreground --signal=TERM 25m stdbuf -oL -eL ./mach configure \
            2>&1 | tee ../bombacha-kit/logs/configure.log
          test -f objdir-bombacha/config.status.json
          cp objdir-bombacha/config.status.json ../bombacha-kit/logs/config.status.json
          ./mach environment --format json | tee ../bombacha-kit/logs/mach-environment.json
          python3 - <<'PY2'
          import json
          p='objdir-bombacha/config.status.json'
          d=json.load(open(p))
          app=d.get('substs',{}).get('MOZ_BUILD_APP')
          print('MOZ_BUILD_APP=', app)
          if app != 'mobile/android':
              raise SystemExit(f'Contexto incorreto: MOZ_BUILD_APP={app!r}')
          PY2
          echo "CONFIGURE_OK $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee ../bombacha-kit/logs/configure-ok.txt
          df -h | tee ../bombacha-kit/logs/disk-after-configure.txt

      - name: Aplicar Bombacha ao Firefox
        shell: bash
        run: |
          set -euxo pipefail
          python3 bombacha-kit/scripts/patch_fenix.py firefox bombacha-kit 2>&1 | tee bombacha-kit/logs/patch.log
          git -C firefox diff -- mobile/android/fenix/app > bombacha-kit/logs/bombacha-patch.diff || true

      - name: Compilar Fenix Bombacha
        working-directory: firefox
        shell: bash
        run: |
          set -euxo pipefail
          timeout --foreground --signal=TERM 70m stdbuf -oL -eL ./mach gradle fenix:assembleDebug \
            --stacktrace --no-daemon \
            2>&1 | tee ../bombacha-kit/logs/gradle-build.log
          echo "GRADLE_OK $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee ../bombacha-kit/logs/gradle-ok.txt

      - name: Localizar APK ARM64
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          find firefox -type f -name '*.apk' -print | sort | tee bombacha-kit/logs/apks-found.txt
          APK=$(grep -Ei '/arm64-v8a/|arm64|aarch64' bombacha-kit/logs/apks-found.txt | grep -Ei 'fenix|app' | grep -v 'third_party/chromium' | head -1 || true)
          if [ -z "$APK" ]; then
            APK=$(grep -Ei 'objdir-bombacha/gradle/build/mobile/android/fenix/app/outputs/apk/debug/.+\.apk$' bombacha-kit/logs/apks-found.txt | head -1 || true)
          fi
          if [ -z "$APK" ]; then
            APK=$(grep -Ei 'fenix|app' bombacha-kit/logs/apks-found.txt | grep -v 'third_party/chromium' | head -1 || true)
          fi
          test -n "$APK"
          cp "$APK" out/Bombacha-Navegador-Firefox-Android-arm64.apk
          sha256sum out/Bombacha-Navegador-Firefox-Android-arm64.apk | tee bombacha-kit/logs/apk-sha256.txt
          ls -lh out/Bombacha-Navegador-Firefox-Android-arm64.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Bombacha-Navegador-Firefox-Android
          path: out/Bombacha-Navegador-Firefox-Android-arm64.apk
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Preparar diagnóstico se falhar
        if: failure()
        shell: bash
        run: |
          mkdir -p bombacha-kit/logs
          df -h > bombacha-kit/logs/disk-after-failure.txt || true
          git -C firefox rev-parse HEAD > bombacha-kit/logs/firefox-commit.txt 2>/dev/null || true
          git -C firefox diff -- mobile/android/fenix/app > bombacha-kit/logs/bombacha-patch.diff 2>/dev/null || true
          find firefox -type f -name '*.apk' -print > bombacha-kit/logs/apks-found.txt 2>/dev/null || true
          test -f firefox/objdir-bombacha/config.status.json && cp firefox/objdir-bombacha/config.status.json bombacha-kit/logs/config.status.json || true
          du -sh "$MOZBUILD_STATE_PATH" "$GRADLE_USER_HOME" "$XDG_CACHE_HOME" "$ANDROID_USER_HOME" "$TMPDIR" > bombacha-kit/logs/cache-sizes.txt 2>/dev/null || true

      - name: Enviar diagnóstico completo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Bombacha-Fenix-Diagnostics
          path: bombacha-kit/logs/
          retention-days: 1
          if-no-files-found: warn
